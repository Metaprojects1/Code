#
# Secure Boot Configuration for CubeOrange Bootloader
# IEC 62443-4-1 Compliant
#

# Enable Secure Boot Security Features
CONFIG_BOOTLOADER_SECURE_BOOT=y

# Signature Verification
CONFIG_BOOTLOADER_SIGNATURE_VERIFY=y
CONFIG_BOOTLOADER_SIGNATURE_TYPE_ECDSA=y
# CONFIG_BOOTLOADER_SIGNATURE_TYPE_RSA is not set

# Hash Algorithm
CONFIG_BOOTLOADER_HASH_SHA256=y

# Firmware Integrity Checks
CONFIG_BOOTLOADER_CRC_CHECK=y
CONFIG_BOOTLOADER_HASH_CHECK=y

# Key Management
CONFIG_BOOTLOADER_MAX_PUBLIC_KEYS=5
CONFIG_BOOTLOADER_KEY_ROTATION=y

# Security Features
CONFIG_BOOTLOADER_ANTI_ROLLBACK=y
CONFIG_BOOTLOADER_TAMPER_DETECTION=y
CONFIG_BOOTLOADER_DEBUG_DISABLE=n  # Can be set to =y for production

# Hardware Security
CONFIG_STM32H7_MEMORY_PROTECTION=y
CONFIG_STM32H7_WATCHDOG_PROTECTION=y

# Secure Storage
CONFIG_BOOTLOADER_SECURE_STORAGE=y
CONFIG_BOOTLOADER_STORAGE_ENCRYPTED=n  # Enable when crypto available

# Logging and Auditing
CONFIG_BOOTLOADER_AUDIT_LOG=y
CONFIG_BOOTLOADER_SECURITY_LOG=y

# Error Handling
CONFIG_BOOTLOADER_SECURE_FAILURE_REBOOT=y
CONFIG_BOOTLOADER_FAILURE_ALARM=y
